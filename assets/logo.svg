<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="ringGrad" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="42" y1="42" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Background ring track (~10% outer margin: r=44, stroke=12 => outer edge at 114, 14px margin) -->
  <circle
    cx="64"
    cy="64"
    r="44"
    stroke="#64748B"
    stroke-opacity="0.28"
    stroke-width="12"
  />

  <!-- Inner subtle badge fill -->
  <circle cx="64" cy="64" r="30" fill="url(#innerGrad)" />

  <!-- Circular progress arc (~78% circumference = 215.6 of 276.46), starting at 12 o'clock -->
  <circle
    cx="64"
    cy="64"
    r="44"
    stroke="url(#ringGrad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-dasharray="216 277"
    transform="rotate(-90 64 64)"
  />

  <!-- High-contrast central gauge needle / pulse -->
  <path
    d="M52 67L60 57L67 65L76 53"
    stroke="#0EA5E9"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="76" cy="53" r="3.5" fill="#10B981" />
</svg>
